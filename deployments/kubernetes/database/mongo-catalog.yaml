# MongoDB instance for the `catalog` bounded context (database pos_catalog).
# Consumers: category, product.
#
# Standalone (bukan replica set). Service headless: alamat stabil
# mongo-catalog.point-of-sale.svc.cluster.local, hanya diakses dari dalam
# cluster (tanpa LoadBalancer).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-catalog
  namespace: point-of-sale
spec:
  serviceName: mongo-catalog
  replicas: 1
  selector:
    matchLabels:
      app: mongo-catalog
  template:
    metadata:
      labels:
        app: mongo-catalog
        tier: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args: ["mongod", "--wiredTigerCacheSizeGB", "1"]
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-catalog
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-catalog
  namespace: point-of-sale
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-catalog
  namespace: point-of-sale
spec:
  # Headless: hanya diakses service dalam cluster (tanpa LoadBalancer).
  clusterIP: None
  selector:
    app: mongo-catalog
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
