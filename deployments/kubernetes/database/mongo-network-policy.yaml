# NetworkPolicies for the five MongoDB instances. Each policy allows ingress on
# port 27017 ONLY from the pods of the services that own that bounded context
# (playbook §1.1). No egress rules: mongod only answers inbound connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-identity
  namespace: point-of-sale
spec:
  podSelector:
    matchLabels:
      app: mongo-identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth
        - podSelector:
            matchLabels:
              app: role
        - podSelector:
            matchLabels:
              app: user
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-merchant
  namespace: point-of-sale
spec:
  podSelector:
    matchLabels:
      app: mongo-merchant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: merchant
        - podSelector:
            matchLabels:
              app: cashier
      ports:
        - protocol: TCP
          port: 27017
---
