# ── Stats Writer (Kafka consumer → ClickHouse) ────────────────────
quarkus.http.port=8095

quarkus.application.name=stats-writer

# Kafka consumer config (Vert.x Kafka client)
kafka.bootstrap.servers=${KAFKA_BROKER:localhost:9092}
kafka.group.id=pos-stats-writer

# ClickHouse
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.http-port=${CLICKHOUSE_PORT:8123}
clickhouse.database=${CLICKHOUSE_DATABASE:pos_stats}
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:none}

# Batch writer
stats-writer.batch.max-size=1000
stats-writer.flush.interval-seconds=5

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common
