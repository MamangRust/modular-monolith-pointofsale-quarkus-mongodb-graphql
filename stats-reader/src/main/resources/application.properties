# gRPC server
quarkus.grpc.server.port=${GRPC_STATS_READER_PORT:9029}

# Redis (cache-aside)
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.client-type=${REDIS_CLIENT_TYPE:cluster}
stats.cache.ttl-seconds=${STATS_CACHE_TTL:300}

# ClickHouse
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.http-port=${CLICKHOUSE_PORT:8123}
clickhouse.database=${CLICKHOUSE_DATABASE:pos_stats}
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:none}

# HTTP disabled (gRPC only)
quarkus.http.port=-1

# Exclude unnecessary CDI beans (keep chaos classes needed by ChaosGrpcInterceptor)
quarkus.arc.exclude-types=\
  com.sanedge.common.cache.RedisService,\
  com.sanedge.common.chaos.ChaosResourceSabotage,\
  com.sanedge.common.chaos.ChaosResourceLeak,\
  com.sanedge.common.chaos.ChaosResourceTimeout,\
  com.sanedge.common.chaos.ChaosCpuPressure,\
  com.sanedge.common.chaos.ChaosMemoryLeak,\
  com.sanedge.common.chaos.ChaosScheduler,\
  com.sanedge.common.observability.*,\
  com.sanedge.common.exception.*,\
  com.sanedge.common.seed.*

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common
