# ── Seeder Orchestrator (clean runner) ─────────────────────────────
# No gRPC, no Hibernate, no Flyway, no HTTP — just CDI + reactive Mongo clients.

quarkus.application.name=seeder

# MongoDB — one named client per bounded context (see PGTOMONGODB.md §1.1).
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.devservices.enabled=false

# Default client: required because the domain modules pull in the Mongo Panache
# extension; point it at the identity instance.
quarkus.mongodb.connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb.database=pos_identity

quarkus.mongodb."identity".connection-string=mongodb://${MONGO_IDENTITY_HOST:localhost}:${MONGO_IDENTITY_PORT:27017}
quarkus.mongodb."identity".database=pos_identity
quarkus.mongodb."merchant".connection-string=mongodb://${MONGO_MERCHANT_HOST:localhost}:${MONGO_MERCHANT_PORT:27017}
quarkus.mongodb."merchant".database=pos_merchant
quarkus.mongodb."catalog".connection-string=mongodb://${MONGO_CATALOG_HOST:localhost}:${MONGO_CATALOG_PORT:27017}
quarkus.mongodb."catalog".database=pos_catalog
quarkus.mongodb."sales".connection-string=mongodb://${MONGO_SALES_HOST:localhost}:${MONGO_SALES_PORT:27017}
quarkus.mongodb."sales".database=pos_sales
quarkus.mongodb."email".connection-string=mongodb://${MONGO_EMAIL_HOST:localhost}:${MONGO_EMAIL_PORT:27017}
quarkus.mongodb."email".database=pos_email

# Disable HTTP server
quarkus.http.port=-1

# Disable scheduler
quarkus.scheduler.enabled=false

# Exclude unnecessary CDI beans (from common module)
quarkus.arc.exclude-types=\
  com.sanedge.common.cache.RedisService,\
  com.sanedge.common.chaos.*,\
  com.sanedge.common.observability.*,\
  com.sanedge.common.exception.*,\
  com.sanedge.common.jwt.*

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
